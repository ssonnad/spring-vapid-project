server.port=8080
spring.application.name=spring-ai-project
spring.datasource.url=jdbc:mysql://localhost:3306/springai
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.redis.timeout=2000
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=2


# AWS Valkey Configuration
# aws.valkey.endpoint=your-valkey-endpoint.cache.amazonaws.com
# aws.valkey.port=6379
# aws.valkey.password=${VALKEY_PASSWORD}
# aws.valkey.ssl=true

# # Primary Node
# aws.valkey.primary.endpoint=primary-node.cache.amazonaws.com
# aws.valkey.primary.port=6379

# # Replica Node
# aws.valkey.replica.endpoint=replica-node.cache.amazonaws.com
# aws.valkey.replica.port=6379
# aws.valkey.replica.priority=100

# Valkey Sentinel Configuration
aws.valkey.sentinels=sentinel1:26379,sentinel2:26379,sentinel3:26379
aws.valkey.master-name=mymaster
aws.valkey.password=${VALKEY_PASSWORD}
aws.valkey.ssl.enabled=true

# Connection Pool Settings
aws.valkey.pool.max-total=128
aws.valkey.pool.max-idle=128
aws.valkey.pool.min-idle=16
aws.valkey.pool.test-on-borrow=true